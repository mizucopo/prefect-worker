name: Release Worker Images

on:
  push:
    branches:
      - main
    paths:
      - version
      - revision
      - images/base/Dockerfile
      - images/process/Dockerfile
      - scripts/resolve-worker-image-tags.sh
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  IMAGE_REPOSITORY: mizucopo/prefect-worker
  DOCKERHUB_USERNAME: mizucopo
  DOCKERHUB_URL: https://hub.docker.com/r/mizucopo/prefect-worker

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Require main
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow can only release from main." >&2
            exit 1
          fi

      - name: Wait for earlier release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          poll_interval=30
          while :; do
            active_runs_json="$(
              gh api --paginate \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/release-worker-images.yml/runs?branch=main&per_page=100" \
                | jq -s \
                  '[.[].workflow_runs[]
                    | select(.status != "completed")]'
            )"
            active_earlier_runs="$(
              jq --argjson current "$GITHUB_RUN_NUMBER" \
                '[.[] | select(.run_number < $current)] | length' \
                <<< "$active_runs_json"
            )"
            active_newer_runs="$(
              jq --argjson current "$GITHUB_RUN_NUMBER" \
                '[.[] | select(.run_number > $current)] | length' \
                <<< "$active_runs_json"
            )"

            if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] \
              && [ "$active_newer_runs" -gt 0 ]; then
              echo "A newer release run is active; refusing this historical rerun." >&2
              exit 1
            fi

            if [ "$active_earlier_runs" -eq 0 ]; then
              break
            fi

            echo "Waiting for $active_earlier_runs earlier release run(s)."
            sleep "$poll_interval"
            poll_interval=$((poll_interval * 2))
            if [ "$poll_interval" -gt 300 ]; then
              poll_interval=300
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release tags
        id: tags
        run: scripts/resolve-worker-image-tags.sh

      - name: Inspect existing git tag and release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          tag_exists=false
          release_exists=false

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"

            if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${tag_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "${release_exists}" = "true" ] && [ "${tag_exists}" != "true" ]; then
            echo "Release ${RELEASE_TAG} exists, but the matching git tag was not found." >&2
            exit 1
          fi

          {
            echo "tag_exists=${tag_exists}"
            echo "release_exists=${release_exists}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stop if release already exists
        if: steps.existing.outputs.tag_exists == 'true' && steps.existing.outputs.release_exists == 'true'
        run: |
          set -euo pipefail

          echo "Release ${{ steps.tags.outputs.release_tag }} already exists for this commit."

      - name: Login to Docker Hub
        if: steps.existing.outputs.tag_exists != 'true' || steps.existing.outputs.release_exists != 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_TOKEN is required." >&2
            exit 1
          fi

          printf '%s' "${DOCKERHUB_TOKEN}" \
            | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Create missing release for existing tag
        if: steps.existing.outputs.tag_exists == 'true' && steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          docker manifest inspect "${BASE_IMAGE}" >/dev/null
          docker manifest inspect "${PROCESS_IMAGE}" >/dev/null

          {
            echo "## Worker Images"
            echo
            echo "この GitHub Release に対応する Worker Image です。"
            echo
            echo "- Base Worker Image: \`${BASE_IMAGE}\`"
            echo "- Process Worker Image: \`${PROCESS_IMAGE}\`"
            echo
            echo "Docker Hub: ${DOCKERHUB_URL}"
          } > release-notes.md

          gh release create "${RELEASE_TAG}" \
            --title "Release ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --latest=false

      - name: Check Docker Hub tags
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          duplicate_found=false

          for image in "${BASE_IMAGE}" "${PROCESS_IMAGE}"; do
            inspect_output="$(docker manifest inspect "${image}" 2>&1)" && inspect_status=0 || inspect_status=$?

            if [ "${inspect_status}" -eq 0 ]; then
              echo "Docker image tag already exists: ${image}" >&2
              duplicate_found=true
            elif printf '%s' "${inspect_output}" | grep -Eq 'no such manifest|manifest unknown'; then
              echo "Docker image tag is available: ${image}"
            else
              echo "Could not inspect Docker Hub tag: ${image}" >&2
              printf '%s\n' "${inspect_output}" >&2
              exit "${inspect_status}"
            fi
          done

          if [ "${duplicate_found}" = "true" ]; then
            exit 1
          fi

      - name: Build and push Base Worker Image
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PREFECT_IMAGE_TAG: ${{ steps.tags.outputs.prefect_image_tag }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg PREFECT_IMAGE_TAG="${PREFECT_IMAGE_TAG}" \
            -t "${BASE_IMAGE}" \
            -f images/base/Dockerfile .

          docker push "${BASE_IMAGE}"

      - name: Build and push Process Worker Image
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            -t "${PROCESS_IMAGE}" \
            -f images/process/Dockerfile .

          docker push "${PROCESS_IMAGE}"

      - name: Create annotated git tag
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Worker Image Release ${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        if: steps.existing.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          {
            echo "## Worker Images"
            echo
            echo "この GitHub Release に対応する Worker Image です。"
            echo
            echo "- Base Worker Image: \`${BASE_IMAGE}\`"
            echo "- Process Worker Image: \`${PROCESS_IMAGE}\`"
            echo
            echo "Docker Hub: ${DOCKERHUB_URL}"
          } > release-notes.md

          gh release create "${RELEASE_TAG}" \
            --title "Release ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --latest=false
