name: Check Worker Image Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: mizucopo/prefect-worker
  REVISION_HINT: Update revision to the next Worker Image Revision, such as r1 or r2.

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect release-triggering changes
        id: release_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          release_inputs=(
            version
            revision
            images/base/Dockerfile
            images/process/Dockerfile
            scripts/resolve-worker-image-tags.sh
            '.github/scripts/*.sh'
          )

          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- "${release_inputs[@]}"; then
            release_changes=false
          else
            diff_status=$?

            if [ "${diff_status}" -ne 1 ]; then
              exit "${diff_status}"
            fi

            release_changes=true
          fi

          echo "release_changes=${release_changes}" >> "${GITHUB_OUTPUT}"

      - name: Report no release changes
        if: steps.release_changes.outputs.release_changes != 'true'
        run: echo "No release-triggering files changed; skipping duplicate tag checks."

      - name: Resolve release tags
        if: steps.release_changes.outputs.release_changes == 'true'
        id: tags
        run: scripts/resolve-worker-image-tags.sh

      - name: Check git tag
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Worker Image Release Tag already exists: ${RELEASE_TAG}" >&2
            echo "${REVISION_HINT}" >&2
            exit 1
          fi

      - name: Check Docker Hub tags
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          duplicate_found=false

          for image in "${BASE_IMAGE}" "${PROCESS_IMAGE}"; do
            repository_path="${image%:*}"
            namespace="${repository_path%%/*}"
            repository="${repository_path#*/}"
            tag="${image##*:}"
            tag_url="https://hub.docker.com/v2/namespaces/${namespace}/repositories/${repository}/tags/${tag}"
            http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${tag_url}")"

            case "${http_status}" in
              200)
                echo "Worker Image Tag already exists on Docker Hub: ${image}" >&2
                duplicate_found=true
                ;;
              404)
                echo "Worker Image Tag is available on Docker Hub: ${image}"
                ;;
              *)
                echo "Could not inspect Docker Hub tag: ${image} (HTTP ${http_status})" >&2
                exit 1
                ;;
            esac
          done

          if [ "${duplicate_found}" = "true" ]; then
            echo "${REVISION_HINT}" >&2
            exit 1
          fi

      - name: Report release tags
        if: steps.release_changes.outputs.release_changes == 'true'
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          echo "Worker Image Release Tag is available: ${RELEASE_TAG}"
          echo "Base Worker Image Tag is available: ${BASE_IMAGE}"
          echo "Process Worker Image Tag is available: ${PROCESS_IMAGE}"
