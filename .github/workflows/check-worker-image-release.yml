name: Check Worker Image Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: mizucopo/prefect-flows

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tags
        id: tags
        run: |
          set -euo pipefail

          prefect_image_tag_raw="$(cat version)"
          revision_raw="$(cat revision)"

          case "${prefect_image_tag_raw}" in
            *$'\n'*)
              echo "version must contain exactly one line." >&2
              exit 1
              ;;
          esac

          case "${revision_raw}" in
            *$'\n'*)
              echo "revision must contain at most one line." >&2
              exit 1
              ;;
          esac

          prefect_image_tag="$(printf '%s' "${prefect_image_tag_raw}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          revision="$(printf '%s' "${revision_raw}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "${prefect_image_tag}" ]; then
            echo "version must not be empty." >&2
            exit 1
          fi

          if [[ "${prefect_image_tag}" == prefect-* ]]; then
            echo "version must contain the Upstream Prefect Image Tag without a prefect- prefix." >&2
            exit 1
          fi

          if [[ ! "${prefect_image_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "version contains characters that are not valid for this release tag." >&2
            exit 1
          fi

          if [ -n "${revision}" ] && [[ ! "${revision}" =~ ^r[0-9]+$ ]]; then
            echo "revision must be empty or match r[0-9]+." >&2
            exit 1
          fi

          release_tag="prefect-${prefect_image_tag}"
          base_image_tag="prefect-${prefect_image_tag}-base"
          process_image_tag="prefect-${prefect_image_tag}-process"

          if [ -n "${revision}" ]; then
            release_tag="${release_tag}-${revision}"
            base_image_tag="${base_image_tag}-${revision}"
            process_image_tag="${process_image_tag}-${revision}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "base_image=${IMAGE_REPOSITORY}:${base_image_tag}"
            echo "process_image=${IMAGE_REPOSITORY}:${process_image_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check git tag
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Worker Image Release Tag already exists: ${RELEASE_TAG}" >&2
            echo "Update revision to the next Worker Image Revision, such as r1 or r2." >&2
            exit 1
          fi

      - name: Check Docker Hub tags
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          duplicate_found=false

          for image in "${BASE_IMAGE}" "${PROCESS_IMAGE}"; do
            inspect_output="$(docker manifest inspect "${image}" 2>&1)" && inspect_status=0 || inspect_status=$?

            if [ "${inspect_status}" -eq 0 ]; then
              echo "Worker Image Tag already exists on Docker Hub: ${image}" >&2
              duplicate_found=true
            elif printf '%s' "${inspect_output}" | grep -Eq 'no such manifest|manifest unknown'; then
              echo "Worker Image Tag is available on Docker Hub: ${image}"
            else
              echo "Could not inspect Docker Hub tag: ${image}" >&2
              printf '%s\n' "${inspect_output}" >&2
              exit "${inspect_status}"
            fi
          done

          if [ "${duplicate_found}" = "true" ]; then
            echo "Update revision to the next Worker Image Revision, such as r1 or r2." >&2
            exit 1
          fi

      - name: Report release tags
        run: |
          set -euo pipefail

          echo "Worker Image Release Tag is available: ${{ steps.tags.outputs.release_tag }}"
          echo "Base Worker Image Tag is available: ${{ steps.tags.outputs.base_image }}"
          echo "Process Worker Image Tag is available: ${{ steps.tags.outputs.process_image }}"
