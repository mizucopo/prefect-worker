name: Check Worker Image Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: mizucopo/prefect-flows
  REVISION_HINT: Update revision to the next Worker Image Revision, such as r1 or r2.

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tags
        id: tags
        run: scripts/resolve-worker-image-tags.sh

      - name: Check git tag
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Worker Image Release Tag already exists: ${RELEASE_TAG}" >&2
            echo "${REVISION_HINT}" >&2
            exit 1
          fi

      - name: Check Docker Hub tags
        env:
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          duplicate_found=false

          for image in "${BASE_IMAGE}" "${PROCESS_IMAGE}"; do
            inspect_output="$(docker manifest inspect "${image}" 2>&1)" && inspect_status=0 || inspect_status=$?

            if [ "${inspect_status}" -eq 0 ]; then
              echo "Worker Image Tag already exists on Docker Hub: ${image}" >&2
              duplicate_found=true
            elif printf '%s' "${inspect_output}" | grep -Eq 'no such manifest|manifest unknown'; then
              echo "Worker Image Tag is available on Docker Hub: ${image}"
            else
              echo "Could not inspect Docker Hub tag: ${image}" >&2
              printf '%s\n' "${inspect_output}" >&2
              exit "${inspect_status}"
            fi
          done

          if [ "${duplicate_found}" = "true" ]; then
            echo "${REVISION_HINT}" >&2
            exit 1
          fi

      - name: Report release tags
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          BASE_IMAGE: ${{ steps.tags.outputs.base_image }}
          PROCESS_IMAGE: ${{ steps.tags.outputs.process_image }}
        run: |
          set -euo pipefail

          echo "Worker Image Release Tag is available: ${RELEASE_TAG}"
          echo "Base Worker Image Tag is available: ${BASE_IMAGE}"
          echo "Process Worker Image Tag is available: ${PROCESS_IMAGE}"
